<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Agenda Kelas — SMAN 5 Sarolangun</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0D1B2A; color: white; display: flex; flex-direction: column; }

    /* HEADER */
    .hdr { flex-shrink:0; background:#111E30; border-bottom:2px solid #E07020; padding:8px 20px; display:flex; align-items:center; justify-content:space-between; height:54px; }
    .hdr-logo-wrap { width:36px; height:36px; border-radius:9px; background:linear-gradient(135deg,#fff5e0,#ffb347,#E07020,#2E7D32,#1A3A5C); padding:2px; flex-shrink:0; }
    .hdr-logo-in { width:100%; height:100%; border-radius:7px; background:white; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .hdr-logo-in img { width:100%; height:100%; object-fit:contain; }
    .hdr-kiri { display:flex; align-items:center; gap:10px; }
    .hdr-nama { font-size:14px; font-weight:700; color:white; }
    .hdr-sub { font-size:11px; color:#607D8B; }
    .hdr-title { font-size:12px; font-weight:700; color:#E07020; letter-spacing:2px; text-transform:uppercase; }
    .jam-digital { font-family:'DM Mono',monospace; font-size:26px; font-weight:500; color:white; line-height:1; text-align:right; }
    .tgl-digital { font-size:11px; color:#607D8B; margin-top:2px; text-align:right; }

    /* SUMMARY BAR */
    .sumbar { flex-shrink:0; background:#0F1C2C; border-bottom:1px solid #1A2E44; padding:5px 20px; display:flex; align-items:center; gap:14px; height:38px; }
    .sum-item { display:flex; align-items:center; gap:6px; }
    .sum-dot { width:9px; height:9px; border-radius:3px; flex-shrink:0; }
    .sum-lbl { font-size:11px; color:#607D8B; }
    .sum-val { font-size:18px; font-weight:700; color:white; font-family:'DM Mono',monospace; margin-left:2px; }
    .sum-div { width:1px; height:20px; background:#1A2E44; }
    .prog-wrap { flex:1; display:flex; align-items:center; gap:8px; }
    .prog-bg { flex:1; height:5px; background:#1A2E44; border-radius:3px; overflow:hidden; }
    .prog-fill { height:100%; background:#43A047; border-radius:3px; transition:width 1s ease; }
    .prog-pct { font-family:'DM Mono',monospace; font-size:13px; font-weight:500; color:#43A047; min-width:38px; text-align:right; }
    .hari-chip { font-size:11px; color:#E07020; font-weight:700; background:rgba(224,112,32,0.15); padding:3px 10px; border-radius:20px; white-space:nowrap; }

    /* MAIN AREA */
    .main { flex:1; display:grid; grid-template-columns:1fr 200px; overflow:hidden; }

    /* ── KIRI: grid kelas + bawah(bar+foto) ── */
    .panel-kiri { display:flex; flex-direction:column; overflow:hidden; }

    /* GRID KELAS */
    .grid-section { flex-shrink:0; padding:10px 16px 8px; }
    .sec-lbl { font-size:10px; font-weight:700; color:#546E7A; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .kelas-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .kartu { border-radius:8px; padding:9px 11px; position:relative; overflow:hidden; }
    .kartu::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
    .kartu.sudah { background:#162A1E; border:1px solid #2E6B34; }
    .kartu.sudah::before { background:#43A047; }
    .kartu.parsial { background:#1A1E0A; border:1px solid #5A6B1A; }
    .kartu.parsial::before { background:#F9A825; }
    .kartu.belum { background:#2A1616; border:1px solid #6B2E2E; animation:denyut 2.5s ease-in-out infinite; }
    .kartu.belum::before { background:#E53935; }
    @keyframes denyut { 0%,100%{border-color:#6B2E2E}50%{border-color:#E53935} }
    .kartu-top { display:flex; justify-content:space-between; align-items:flex-start; }
    .kartu-nama { font-size:15px; font-weight:700; color:white; }
    .kartu-ikon { font-size:12px; }
    .kartu-guru { font-size:10px; color:#90A4AE; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:2px 0 5px; }
    .mapel-row { display:flex; flex-wrap:wrap; gap:2px; margin-bottom:6px; }
    .mc { font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px; }
    .mc-ok { background:rgba(67,160,71,0.25); color:#81C784; }
    .mc-no { background:rgba(229,57,53,0.2); color:#EF9A9A; }
    .kartu-pb { height:3px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; margin-bottom:3px; }
    .kartu-pbf { height:100%; border-radius:2px; }
    .kartu-bot { display:flex; justify-content:space-between; align-items:center; }
    .kartu-sesi { font-size:9px; color:#546E7A; }
    .kartu-pct { font-size:11px; font-weight:700; font-family:'DM Mono',monospace; }

    /* BAWAH KIRI: bar + foto */
    .bawah-section { flex:1; display:grid; grid-template-columns:220px 1fr; gap:0; overflow:hidden; }

    /* BAR CHART */
    .bar-panel { padding:10px 14px; background:#0F1C2C; border-top:1px solid #1A2E44; border-right:1px solid #1A2E44; overflow-y:auto; }
    .bar-item { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
    .bar-lbl { font-size:10px; font-weight:500; color:#90A4AE; min-width:36px; font-family:'DM Mono',monospace; }
    .bar-bg { flex:1; height:14px; background:#1A2E44; border-radius:3px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:3px; display:flex; align-items:center; justify-content:flex-end; padding-right:3px; min-width:4px; }
    .bar-txt { font-size:8px; font-weight:700; color:rgba(255,255,255,0.9); }
    .bar-pct { font-size:9px; font-weight:500; font-family:'DM Mono',monospace; min-width:28px; text-align:right; }

    /* SLIDER FOTO */
    .foto-panel { position:relative; overflow:hidden; background:#0A1520; border-top:1px solid #1A2E44; }
    .slider-track { display:flex; height:100%; transition:transform 0.8s cubic-bezier(0.4,0,0.2,1); }
    .slider-slide { min-width:100%; height:100%; flex-shrink:0; position:relative; }
    .slider-slide img { width:100%; height:100%; object-fit:cover; display:block; }
    .slider-caption { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,0.75)); padding:20px 14px 8px; }
    .slider-caption p { font-size:12px; font-weight:500; color:white; }
    .slider-dots { position:absolute; bottom:6px; right:12px; display:flex; gap:4px; }
    .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.3); cursor:pointer; transition:background 0.3s; }
    .dot.on { background:#E07020; }

    /* ── KANAN: capaian guru ── */
    .panel-kanan { background:#0F1C2C; border-left:1px solid #1A2E44; padding:10px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:0; }
    .guru-item { display:flex; align-items:center; gap:5px; padding:5px 0; border-bottom:1px solid #1A2E44; }
    .guru-item:last-child { border-bottom:none; }
    .guru-kode { font-family:'DM Mono',monospace; font-size:9px; font-weight:500; background:#1A3A5C; color:#90CAF9; padding:1px 4px; border-radius:3px; flex-shrink:0; min-width:22px; text-align:center; }
    .guru-nm { font-size:10px; color:#CFD8DC; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .guru-pb { width:40px; height:3px; background:#1A2E44; border-radius:2px; overflow:hidden; flex-shrink:0; }
    .guru-pb-fill { height:100%; border-radius:2px; }
    .guru-pc { font-size:9px; font-family:'DM Mono',monospace; min-width:26px; text-align:right; flex-shrink:0; }

    /* TICKER */
    .ticker { flex-shrink:0; background:#B85510; padding:4px 16px; font-size:11px; font-weight:600; color:white; display:flex; align-items:center; gap:10px; height:24px; }
    .ticker-lbl { background:white; color:#B85510; padding:1px 6px; border-radius:5px; font-size:9px; font-weight:800; flex-shrink:0; }
    .ticker-scroll { flex:1; overflow:hidden; white-space:nowrap; }
    .ticker-txt { display:inline-block; animation:scroll 35s linear infinite; }
    @keyframes scroll { from{transform:translateX(100%)} to{transform:translateX(-100%)} }

    /* LOADING */
    .loading { position:fixed; inset:0; background:#0D1B2A; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:999; }
    .spinner { width:42px; height:42px; border:3px solid #1A2E44; border-top-color:#E07020; border-radius:50%; animation:putar 0.8s linear infinite; }
    @keyframes putar { to{transform:rotate(360deg)} }
  </style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p style="font-size:13px;color:#607D8B">Memuat data...</p>
</div>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-kiri">
    <div class="hdr-logo-wrap"><div class="hdr-logo-in"><img src="../shared/logo.jpg" alt="Logo" onerror="this.style.display='none'"></div></div>
    <div><div class="hdr-nama">SMAN 5 Sarolangun</div><div class="hdr-sub">Kreatif &amp; Berkarakter</div></div>
  </div>
  <div class="hdr-title">Monitor Agenda Kelas Real-time</div>
  <div><div class="jam-digital" id="jam">--:--:--</div><div class="tgl-digital" id="tanggal">--</div></div>
</div>

<!-- SUMMARY BAR -->
<div class="sumbar">
  <div class="sum-item"><div class="sum-dot" style="background:#43A047"></div><span class="sum-lbl">Lengkap</span><span class="sum-val" id="jml-lengkap">0</span></div>
  <div class="sum-div"></div>
  <div class="sum-item"><div class="sum-dot" style="background:#F9A825"></div><span class="sum-lbl">Sebagian</span><span class="sum-val" id="jml-sebagian">0</span></div>
  <div class="sum-div"></div>
  <div class="sum-item"><div class="sum-dot" style="background:#E53935"></div><span class="sum-lbl">Belum</span><span class="sum-val" id="jml-belum">0</span></div>
  <div class="sum-div"></div>
  <div class="sum-item"><div class="sum-dot" style="background:#546E7A"></div><span class="sum-lbl">Total</span><span class="sum-val" id="jml-total">0</span></div>
  <div class="sum-div"></div>
  <div class="prog-wrap"><div class="prog-bg"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div><div class="prog-pct" id="prog-pct">0%</div></div>
  <div class="hari-chip" id="hari-chip">--</div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- KIRI -->
  <div class="panel-kiri">
    <!-- GRID KELAS -->
    <div class="grid-section">
      <div class="sec-lbl">Status Agenda per Kelas</div>
      <div class="kelas-grid" id="kelas-grid">
        <div style="grid-column:1/-1;text-align:center;padding:30px;color:#546E7A">Memuat...</div>
      </div>
    </div>

    <!-- BAWAH: BAR + FOTO -->
    <div class="bawah-section">

      <!-- BAR CHART -->
      <div class="bar-panel">
        <div class="sec-lbl" style="margin-bottom:8px">Progress per Rombel</div>
        <div id="bar-chart"></div>
      </div>

      <!-- SLIDER FOTO -->
      <div class="foto-panel" id="foto-panel">
        <div class="slider-track" id="slider-track"></div>
        <div class="slider-dots" id="slider-dots"></div>
      </div>

    </div>
  </div>

  <!-- KANAN: CAPAIAN GURU -->
  <div class="panel-kanan">
    <div class="sec-lbl" style="margin-bottom:8px;flex-shrink:0;">Capaian Guru Hari Ini</div>
    <div id="guru-list"></div>
  </div>

</div>

<!-- TICKER -->
<div class="ticker">
  <span class="ticker-lbl">INFO</span>
  <div class="ticker-scroll"><span class="ticker-txt" id="ticker-txt">Sistem Monitor Agenda Kelas SMAN 5 Sarolangun · Kreatif &amp; Berkarakter</span></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const db = getFirestore(initializeApp({
    apiKey:"AIzaSyC1p_ZWco5ERzi7u-dzQOJbA_nVewS3ahE",
    authDomain:"agedasmanli.firebaseapp.com",
    projectId:"agedasmanli",
    storageBucket:"agedasmanli.firebasestorage.app",
    messagingSenderId:"969562298791",
    appId:"1:969562298791:web:320a29a007c74739217e82"
  }));

  const namaHari  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  function updateJam() {
    const n = new Date();
    document.getElementById('jam').textContent = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
    document.getElementById('tanggal').textContent = `${namaHari[n.getDay()]}, ${n.getDate()} ${namaBulan[n.getMonth()]} ${n.getFullYear()}`;
  }
  updateJam(); setInterval(updateJam, 1000);

  const now        = new Date();
  const hariIni    = namaHari[now.getDay()];
  const tanggalStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('hari-chip').textContent = hariIni;

  let cacheGuru = {};

  async function init() {
    const gSnap = await getDocs(collection(db,'Data_Guru'));
    gSnap.docs.forEach(d => { cacheGuru[d.id] = d.data(); });

    const jSnap = await getDocs(query(collection(db,'Jadwal_Pelajaran'), where('hari','==',hariIni)));
    const rombelMap = {};
    jSnap.docs.forEach(d => {
      const dd = d.data();
      const rid = dd.id_rombel || dd.nama_kelas || dd.kelas;
      if (!rombelMap[rid]) rombelMap[rid] = { id:rid, namaKelas:dd.nama_kelas||dd.kelas||rid, slots:[] };
      rombelMap[rid].slots.push({ docId:d.id, id_rombel:rid, ...dd });
    });
    const rombelList = Object.values(rombelMap).sort((a,b) => {
      const urutan = k => {
        const n = k.namaKelas || '';
        const tingkat = n.startsWith('XII') ? 3 : n.startsWith('XI') ? 2 : 1;
        const nomor   = parseInt(n.replace(/[^0-9]/g,'')) || 0;
        return tingkat * 100 + nomor;
      };
      return urutan(a) - urutan(b);
    });

    if (!rombelList.length) {
      document.getElementById('kelas-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:#546E7A">Tidak ada jadwal hari ini</div>';
      document.getElementById('loading').style.display = 'none';
      return;
    }

    onSnapshot(query(collection(db,'Agenda_Harian'), where('tanggal','==',tanggalStr)), snap => {
      const agendaDocs = snap.docs.map(d => d.data());
      const byId   = new Set(agendaDocs.map(d=>d.id_jadwal).filter(Boolean));
      const bySlot = new Set(agendaDocs.filter(d=>d.id_rombel&&d.slot_urutan).map(d=>`${d.id_rombel}_${d.slot_urutan}`));
      const byKelas= new Set(agendaDocs.filter(d=>d.kelas&&d.mapel).map(d=>`${d.kelas}_${d.mapel}`));

      function cek(s) {
        return byId.has(s.docId) || bySlot.has(`${s.id_rombel}_${s.slot_urutan}`) || byKelas.has(`${s.nama_kelas||s.kelas}_${s.nama_mapel||s.mata_pelajaran}`);
      }

      const data = rombelList.map(r => {
        const mm = {};
        r.slots.forEach(s => {
          const km = s.kode_mapel||s.id_mapel||'?';
          if (!mm[km]) mm[km] = {kode:km,terisi:false,slots:[]};
          mm[km].slots.push(s);
        });
        Object.values(mm).forEach(m => { m.terisi = m.slots.some(s=>cek(s)); });
        const ml = Object.values(mm);
        const tot = ml.length, ter = ml.filter(m=>m.terisi).length;
        const pct = tot>0?Math.round(ter/tot*100):0;
        const g = cacheGuru[r.slots[0]?.id_guru||''];
        return { ...r, ml, tot, ter, pct, guruStr: g?`${g.kode_guru||'??'} · ${(g.nama_lengkap||'').split(',')[0]}`:'—', guruId:r.slots[0]?.id_guru||'' };
      });

      renderGrid(data);
      renderBar(data);
      renderGuru(data);
      renderSummary(data);
      renderTicker(data);
      document.getElementById('loading').style.display = 'none';
    });
  }

  function renderGrid(data) {
    document.getElementById('kelas-grid').innerHTML = data.map(r => {
      const s=r.pct===100?'sudah':r.pct>0?'parsial':'belum';
      const ikon=r.pct===100?'✅':r.pct>0?'⚡':'🔴';
      const w=r.pct===100?'#43A047':r.pct>0?'#F9A825':'#E53935';
      const chips=r.ml.map(m=>`<span class="mc ${m.terisi?'mc-ok':'mc-no'}">${m.kode}</span>`).join('');
      return `<div class="kartu ${s}">
        <div class="kartu-top"><div class="kartu-nama">${r.namaKelas}</div><span class="kartu-ikon">${ikon}</span></div>
        <div class="kartu-guru">${r.guruStr}</div>
        <div class="mapel-row">${chips}</div>
        <div class="kartu-pb"><div class="kartu-pbf" style="width:${r.pct}%;background:${w}"></div></div>
        <div class="kartu-bot"><span class="kartu-sesi">${r.ter}/${r.tot} sesi</span><span class="kartu-pct" style="color:${w}">${r.pct}%</span></div>
      </div>`;
    }).join('');
  }

  function renderBar(data) {
    const sorted = [...data].sort((a,b)=>b.pct-a.pct);
    document.getElementById('bar-chart').innerHTML = sorted.map(r => {
      const w=r.pct===100?'#43A047':r.pct>0?'#F9A825':'#E53935';
      const wp=r.pct===100?'#81C784':r.pct>0?'#FFB74D':'#EF9A9A';
      return `<div class="bar-item">
        <div class="bar-lbl">${r.namaKelas}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.max(r.pct,4)}%;background:${w}">${r.pct>25?`<span class="bar-txt">${r.ter}/${r.tot}</span>`:''}</div></div>
        <div class="bar-pct" style="color:${wp}">${r.pct}%</div>
      </div>`;
    }).join('');
  }

  function renderGuru(data) {
    const rekap = {};
    data.forEach(r => {
      r.ml.forEach(m => {
        const gid = r.slots.find(s=>s.kode_mapel===m.kode||s.id_mapel===m.kode)?.id_guru || r.guruId;
        if (!gid) return;
        if (!rekap[gid]) rekap[gid] = {total:0,terisi:0};
        rekap[gid].total++; if(m.terisi) rekap[gid].terisi++;
      });
    });
    const entries = Object.entries(rekap).map(([gid,r])=>({gid,...r,pct:Math.round(r.terisi/r.total*100)})).sort((a,b)=>b.pct-a.pct);
    document.getElementById('guru-list').innerHTML = entries.map(e => {
      const g=cacheGuru[e.gid];
      const nama=(g?.nama_lengkap||'—').split(',')[0];
      const kode=g?.kode_guru||'??';
      const w=e.pct===100?'#43A047':e.pct>0?'#F9A825':'#E53935';
      const wp=e.pct===100?'#81C784':e.pct>0?'#FFB74D':'#EF9A9A';
      return `<div class="guru-item">
        <div class="guru-kode">${kode}</div>
        <div class="guru-nm">${nama}</div>
        <div class="guru-pb"><div class="guru-pb-fill" style="width:${e.pct}%;background:${w}"></div></div>
        <div class="guru-pc" style="color:${wp}">${e.pct}%</div>
      </div>`;
    }).join('');
  }

  function renderSummary(data) {
    const L=data.filter(r=>r.pct===100).length,S=data.filter(r=>r.pct>0&&r.pct<100).length,B=data.filter(r=>r.pct===0).length,T=data.length;
    const P=T>0?Math.round(data.reduce((s,r)=>s+r.pct,0)/T):0;
    document.getElementById('jml-lengkap').textContent=L;
    document.getElementById('jml-sebagian').textContent=S;
    document.getElementById('jml-belum').textContent=B;
    document.getElementById('jml-total').textContent=T;
    document.getElementById('prog-fill').style.width=P+'%';
    document.getElementById('prog-pct').textContent=P+'%';
  }

  function renderTicker(data) {
    const belum=data.filter(r=>r.pct<100).map(r=>r.namaKelas);
    const L=data.filter(r=>r.pct===100).length;
    let txt=`Rekap ${hariIni}: ${L} dari ${data.length} kelas lengkap`;
    if(belum.length) txt+=` · Belum: ${belum.join(', ')}`;
    else txt+=' · Semua kelas sudah mengisi agenda!';
    txt+=' · SMAN 5 Sarolangun · Kreatif & Berkarakter';
    document.getElementById('ticker-txt').textContent=txt;
  }

  // SLIDER FOTO
  const fotos=[
    {src:'../shared/foto/foto1.jpg',caption:'Kegiatan Belajar Mengajar'},
    {src:'../shared/foto/foto2.jpg',caption:'Upacara Bendera'},
    {src:'../shared/foto/foto3.jpg',caption:'Ekstrakurikuler'},
    {src:'../shared/foto/foto4.jpg',caption:'Prestasi Siswa'},
    {src:'../shared/foto/foto5.jpg',caption:'SMAN 5 Sarolangun'},
  ];
  let sliderIdx=0, valid=[], checked=0;
  const track=document.getElementById('slider-track');
  const dotsEl=document.getElementById('slider-dots');

  fotos.forEach((f,i)=>{
    const img=new Image();
    img.onload =()=>{valid.push({...f,i});checked++;if(checked===fotos.length)buildSlider();};
    img.onerror=()=>{checked++;if(checked===fotos.length)buildSlider();};
    img.src=f.src;
  });

  function buildSlider(){
    if(!valid.length){
      document.getElementById('foto-panel').innerHTML=
        `<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#546E7A;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <p style="font-size:12px;">Upload foto ke shared/foto/</p>
        </div>`;
      return;
    }
    valid.sort((a,b)=>a.i-b.i);
    track.innerHTML=valid.map(f=>
      `<div class="slider-slide"><img src="${f.src}" alt="${f.caption}">
       <div class="slider-caption"><p>${f.caption}</p></div></div>`
    ).join('');
    dotsEl.innerHTML=valid.map((_,i)=>`<div class="dot ${i===0?'on':''}" onclick="goSlide(${i})"></div>`).join('');
    setInterval(()=>{sliderIdx=(sliderIdx+1)%valid.length;goSlide(sliderIdx);},5000);
  }

  window.goSlide=function(i){
    sliderIdx=i;
    track.style.transform=`translateX(-${i*100}%)`;
    document.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===i));
  };

  init();
</script>
</body>
</html>
